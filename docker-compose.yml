# The whole pipeline: API, consumer, Postgres, Kafka and Redis (Steps 3.4, 4.1, 4.6, 5.1).
#
#   docker compose up -d --build                        # or: make up
#   docker compose run --rm producer --limit 1000       # stream transactions in (make stream)
#   docker compose logs -f consumer
#   docker compose down                                 # stops everything; data is kept
#   docker compose down -v                              # also deletes the database and Kafka volumes
#
# Values like ${POSTGRES_PORT:-5433} come from .env in this folder if set there,
# otherwise the default after ":-".

name: fraud-detection

# Where the decisions live. Its own block because the dashboard needs this and
# nothing else from the scoring settings below: it reads the table, it does not
# score. Inside the Compose network services are reached by their service names.
x-database-environment: &database-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud}@postgres:5432/${POSTGRES_DB:-fraud}

# Settings the API and the consumer must share, so a transaction gets the same
# decision whichever way it arrives. Not `env_file: .env`, which would also bring
# in the 127.0.0.1 addresses that are wrong inside a container.
x-scoring-environment: &scoring-environment
  <<: *database-environment
  PERSIST_DECISIONS: "true"
  REDIS_URL: redis://redis:6379/0
  VELOCITY_FEATURES: ${VELOCITY_FEATURES:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.24}
  BLOCK_THRESHOLD: ${BLOCK_THRESHOLD:-0.95}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      # A local demo credential. Anything shared needs a real secret instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
    volumes:
      # A named volume: decisions survive `docker compose down` and container rebuilds.
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 only, so the database is not reachable from your network. 5433
      # on your machine, because a locally installed Postgres usually owns 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # $$ passes a literal $ through to the container's shell.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # Recent activity per card, for velocity features (Phase 5). Everything in
    # here is derived from transactions Kafka still holds, so:
    #   --save "" --appendonly no  nothing is written to disk; a restart starts empty
    #   --maxmemory / allkeys-lru  a memory limit it cannot grow past. If velocity
    #                              keys ever outgrow it, Redis drops the least
    #                              recently used ones instead of the server dying.
    image: redis:8-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      # 127.0.0.1 only. Redis has no password here, so it must not be reachable
      # from the network: anything that connects can read and delete everything.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      target: service
    image: fraud-detection-api
    depends_on:
      postgres:
        # Wait until Postgres accepts connections, not merely until its container
        # has started. The API would recover without this, but would log a warning.
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *scoring-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  kafka:
    # KRaft mode: the broker runs its own controller, so there is no ZooKeeper
    # service. Pinned: Kafka 4 removed old protocol versions that clients rely on.
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two doors into the same broker. A client connects, then the broker tells it
      # which address to use from then on, so each door must advertise an address
      # that works from where that client runs:
      #   INTERNAL  kafka:29092     for containers on the Compose network
      #   EXTERNAL  127.0.0.1:9092  for scripts and tests on your machine
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so every internal topic can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Topics are created on purpose by kafka-init. Auto-creation would turn a typo
      # in a topic name into a new, silently empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Messages are kept for 7 days whether or not they have been read.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # A consumer joining an empty group starts at once instead of waiting 3s.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The default 1 GB heap is more than a laptop demo needs.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      # Messages and consumer offsets survive `docker compose down`.
      - kafka-data:/var/lib/kafka/data
    ports:
      # EXTERNAL listener only, on 127.0.0.1. Use 127.0.0.1, not localhost, in
      # KAFKA_BOOTSTRAP_SERVERS for the same IPv6 reason as DATABASE_URL.
      - "127.0.0.1:9092:9092"
    healthcheck:
      # Asks the broker for its API versions through the address other containers
      # use, so "healthy" means the INTERNAL listener really answers.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    # Runs once, creates the topics if they are missing, and exits. Services that
    # read or write them wait for it with `condition: service_completed_successfully`.
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        # 3 partitions: up to 3 consumers in the fraud-scorer group can share the work.
        $$topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-transactions} --partitions 3 --replication-factor 1
        # 1 partition: dead letters are rare and read by people, in arrival order.
        $$topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_DLQ_TOPIC:-transactions.dlq} --partitions 1 --replication-factor 1
        $$topics --bootstrap-server kafka:29092 --describe --topic ${KAFKA_TOPIC:-transactions}
        $$topics --bootstrap-server kafka:29092 --describe --topic ${KAFKA_DLQ_TOPIC:-transactions.dlq}
    restart: "no"

  consumer:
    # The API's image, running scripts/consume.py instead of the web server.
    build:
      context: .
      target: service
    image: fraud-detection-api
    command: ["python", "-m", "scripts.consume"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *scoring-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-transactions.dlq}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-fraud-scorer}
      CONSUMER_MAX_BATCH: ${CONSUMER_MAX_BATCH:-500}
      CONSUMER_METRICS_PORT: ${CONSUMER_METRICS_PORT:-8001}
    ports:
      # Metrics only, on 127.0.0.1: the consumer serves nothing else.
      - "127.0.0.1:${CONSUMER_METRICS_PORT:-8001}:8001"
    # Answering a scrape proves the process is alive and its loop is not wedged
    # (Step 6.2). Lag is deliberately not part of this: lag usually means the
    # producer sped up, and restarting the consumer would only make it worse.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=5)"
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    # On `docker compose stop` the consumer finishes and commits its current batch.
    # A batch takes well under a second; 30s leaves room for a slow database.
    stop_grace_period: 30s
    restart: unless-stopped

  dashboard:
    # The analyst view of what the pipeline decided, at http://127.0.0.1:8501
    # (Step 6.6). It only reads Postgres, so it is never in the path of a
    # decision: a slow or broken dashboard cannot slow down a payment.
    build:
      context: .
      target: dashboard
    image: fraud-detection-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-environment
      # Drawn as lines on the risk histogram, so they must be the thresholds the
      # scorer actually used.
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.24}
      BLOCK_THRESHOLD: ${BLOCK_THRESHOLD:-0.95}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped

  producer:
    # A stand-in for the card network, run on demand rather than started by `up`:
    #   docker compose run --rm producer --limit 1000 --rate 50
    build:
      context: .
      target: producer
    image: fraud-detection-producer
    profiles: ["tools"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      PRODUCER_RATE_PER_SEC: ${PRODUCER_RATE_PER_SEC:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # The test split written by `python -m src.ml.train`, read-only.
      - ./data/processed:/app/data/processed:ro

volumes:
  postgres-data:
  kafka-data:

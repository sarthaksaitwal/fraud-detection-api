[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    postgres: runs against a real Postgres (TEST_DATABASE_URL or DATABASE_URL); skipped when none answers
    kafka: runs against a real Kafka broker (KAFKA_BOOTSTRAP_SERVERS); skipped when none answers
    redis: runs against a real Redis (TEST_REDIS_URL or REDIS_URL); skipped when none answers
